<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>《原神》7.0版本「無神憐愛的雪國」</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#060d1c;--cyan:#8de8ff;}
  *{box-sizing:border-box} body{margin:0;font-family:'Noto Sans TC',system-ui;background:var(--bg);color:#fff;overflow-x:hidden}
  .hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden}
  .hero-bg{position:absolute;inset:0;}
  .hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center 18%;filter:brightness(1.05) saturate(1.1)}
  .hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,13,28,0.15) 0%, rgba(6,13,28,0.2) 45%, rgba(6,13,28,0.92) 85%), radial-gradient(120% 80% at 50% 0%, rgba(120,220,255,0.25), transparent 60%)}
  .snow{position:absolute;inset:0;pointer-events:none}
  .snow i{position:absolute;top:-10px;background:#fff;border-radius:50%;opacity:.8;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh) translateX(20px)}}
  .wrap{position:relative;max-width:1120px;margin:0 auto;padding:0 20px;width:100%}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(141,232,255,.12);border:1px solid rgba(141,232,255,.25);font-size:11px;letter-spacing:.25em;color:#bfefff}
  .title{font-family:'Noto Serif TC',serif;font-size:clamp(36px,11vw,86px);line-height:.95;letter-spacing:.12em;margin:14px 0 8px;text-shadow:0 0 18px rgba(141,232,255,.8),0 0 40px rgba(120,180,255,.5);background:linear-gradient(180deg,#fff 15%,#b8eeff 55%,#6fc7ff 90%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 rgba(255,255,255,.2))}
  .sub{letter-spacing:.35em;color:#cfefff;font-size:clamp(11px,2.8vw,14px);opacity:.9}
  .cards{display:grid;grid-template-columns:1fr;gap:16px;margin-top:22px}
  @media(min-width:680px){.cards{grid-template-columns:repeat(3,1fr)}}
  .card{position:relative;padding:22px 18px 18px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(15,39,77,.7));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px);text-align:center;overflow:hidden}
  .card::before{content:'';position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent)}
  .card h4{margin:10px 0 2px;font-size:15px;letter-spacing:.2em}
  .card .amt{font-size:30px;font-weight:900;background:linear-gradient(180deg,#fff,#7ad7ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .section{padding:36px 0 60px;background:radial-gradient(80% 60% at 50% 0%,rgba(100,200,255,.12),transparent),#070f22}
  .reward-btn{width:min(94%,780px);height:84px;border:0;border-radius:999px;background:linear-gradient(180deg,#ffffff 0%,#f0fbff 55%,#d9f3ff 100%);box-shadow:0 0 0 1px rgba(255,255,255,.95),0 0 36px rgba(120,210,255,.9),0 12px 40px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;position:relative;padding:0 88px 0 24px;cursor:pointer;transition:all .18s ease}
  .reward-btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,1),0 0 48px rgba(140,230,255,1),0 16px 48px rgba(0,0,0,.5)}
  .reward-btn:active{transform:scale(.985)}
  .reward-btn .txt{font-family:'Noto Serif TC',serif;font-size:clamp(16px,3.4vw,24px);font-weight:900;letter-spacing:.32em;color:#0b1e3a;text-align:center;line-height:1}
  .reward-btn .arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:60px;height:60px;border-radius:50%;background:#0c1e38;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15)}
  .reward-btn .arrow svg{width:26px;height:26px;stroke:#ffffff;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  /* Modal */
  .modal-mask{position:fixed;inset:0;z-index:100;background:rgba(3,10,24,.72);backdrop-filter:blur(12px);display:none;place-items:center;padding:20px}
  .modal-mask.show{display:grid}
  .modal-box{width:min(92vw,420px);background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(226,244,255,.96));border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:0 0 0 1px rgba(141,232,255,.3),0 0 40px rgba(100,200,255,.5),0 20px 60px rgba(0,0,0,.6);padding:28px 22px 20px;position:relative;text-align:center;animation:pop .28s cubic-bezier(.16,1.2,.36,1)}
  @keyframes pop{from{transform:translateY(12px) scale(.94);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
  .modal-box .m-title{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:900;letter-spacing:.15em;color:#0e2a5a;margin:0 0 12px;background:linear-gradient(180deg,#1a4b8f,#0b1e3a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .modal-box .m-desc{font-size:13px;line-height:1.8;letter-spacing:.12em;color:#3a4e6d;margin:0 auto 20px;max-width:320px}
  .modal-box .m-btn{width:100%;height:56px;border:0;border-radius:999px;background:linear-gradient(180deg,#8de8ff,#4ab6f5 55%,#2d7fd8);color:#fff;font-size:16px;font-weight:900;letter-spacing:.22em;cursor:pointer;box-shadow:0 6px 18px rgba(45,127,216,.5),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .15s}
  .modal-box .m-btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(45,127,216,.6)}
  .modal-box .m-btn:active{transform:scale(.97)}
  .modal-box .m-close{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.08);background:rgba(0,0,0,.04);color:#6a7a94;cursor:pointer;display:grid;place-items:center;font-size:14px}
</style>
</head>
<body>
<section class="hero">
  <div class="hero-bg"><img src="hero.png" alt="Genshin 7.0 Snow"></div>
  <div class="snow" id="snow"></div>
  <div class="wrap" style="padding-bottom:40px;padding-top:80px">
    <div class="badge">❄ 7.0版本「無神憐愛的雪國」 ❄</div>
    <h1 class="title">前瞻特別節目</h1>
    <div class="sub">PROLOGUE • FATUI • SNEZHNAYA • 2026 WINTER</div>
    <div class="cards">
      <div class="card"><img src="primogem_clean.png" style="width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(140,220,255,0.9));margin:0 auto;display:block" alt="原石"><h4>原石</h4><div class="amt">×800</div></div>
      <div class="card"><img src="intertwined_clean.png" style="width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(255,160,220,0.7));margin:0 auto;display:block" alt="糾纏之緣"><h4>糾纏之緣</h4><div class="amt">×10</div></div>
      <div class="card"><img src="acquaint_clean.png" style="width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(120,200,255,0.7));margin:0 auto;display:block" alt="相遇之緣"><h4>相遇之緣</h4><div class="amt">×10</div></div>
    </div>
  </div>
</section>
<section class="section" id="reward">
  <div class="wrap" style="display:flex;justify-content:center">
    <button class="reward-btn" id="openModal">
      <span class="txt">精彩獎勵一覽 • 立即領取兌換碼</span>
      <span class="arrow"><svg viewBox="0 0 24 24"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg></span>
    </button>
  </div>
</section>

<div class="modal-mask" id="modalMask">
  <div class="modal-box">
    <button class="m-close" id="closeModal">✕</button>
    <h3 class="m-title">申請領取說明</h3>
    <p class="m-desc">參與活動即可領取原石等限時獎勵！<br><span style="font-size:11px;line-height:1.7;display:block;margin-top:10px;text-align:left;opacity:.85;letter-spacing:.08em">*注意：獎勵以完成申請後領取禮包碼時間為準<br>*兌換碼將於2026/9/22 23:59:59（UTC+8）失效，請旅行者盡快兌換哦~</span></p>
    <button class="m-btn" onclick="window.open('https://lin.ee/nvJjPZU', '_blank')">前往領取禮包兌換碼</button>
  </div>
</div>

<script>
const snowBox=document.getElementById('snow');
for(let i=0;i<28;i++){
  const s=document.createElement('i');
  s.style.left=Math.random()*100+'%';
  s.style.width=(1+Math.random()*3)+'px';
  s.style.height=s.style.width;
  s.style.animationDuration=(6+Math.random()*12)+'s';
  s.style.animationDelay=(Math.random()*-20)+'s';
  s.style.opacity=0.3+Math.random()*0.7;
  snowBox.appendChild(s);
}
const mask=document.getElementById('modalMask');
document.getElementById('openModal').addEventListener('click',()=>{mask.classList.add('show')});
document.getElementById('closeModal').addEventListener('click',()=>{mask.classList.remove('show')});
mask.addEventListener('click',(e)=>{if(e.target===mask)mask.classList.remove('show')});
</script>
</body>
</html>
